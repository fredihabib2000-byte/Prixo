<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — PRIXO ESL Manager</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">P</span><span class="brand-name">PRIXO</span></div>
    <h1>Sign in to your store</h1>
    <div class="sub">Electronic shelf label management</div>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label>Company code</label>
        <input type="text" name="tenant" placeholder="e.g. green-mart" required value="{{ tenant or '' }}" autocapitalize="off">
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required autocapitalize="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div class="auth-foot">Not a customer yet? Contact your PRIXO sales rep.</div>
  </div>
</div>
</body>
</html>
