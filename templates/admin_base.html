<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Owner console — PRIXO{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div style="max-width:1100px;margin:0 auto;padding:28px 30px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;">
    <div class="brand"><span class="brand-mark">P</span><span class="brand-name">PRIXO</span><span style="color:var(--muted);font-size:12px;margin-left:6px;">owner console</span></div>
    <div style="display:flex;gap:16px;align-items:center;">
      <a href="/admin" style="color:var(--muted);font-size:13px;">Clients</a>
      <a href="/admin/logout" style="color:var(--muted);font-size:13px;">Log out</a>
    </div>
  </div>
  {% if request.query_params.get('msg') %}<div class="flash">{{ request.query_params.get('msg') }}</div>{% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
