services:
  prixo:
    build: .
    container_name: prixo_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env (Supabase connection string)}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - PW_SALT=${PW_SALT:?Set PW_SALT in .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-owner}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: prixo_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - prixo

volumes:
  caddy_data:
  caddy_config:
